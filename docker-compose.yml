services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: appuser
        uid: 1000
    container_name: shop_west_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - shop_west
    depends_on:
      - mysql

  nginx:
    image: nginx:1.25-alpine
    container_name: shop_west_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shop_west
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: shop_west_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop_west}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-appuser}
    ports:
      - "3306:3306"
    volumes:
      - shop_west_mysql:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - shop_west

  node:
    image: node:20-alpine
    container_name: shop_west_node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    networks:
      - shop_west
    command: sh -c "npm install && npm run dev"

  mailpit:
    image: axllent/mailpit:latest
    container_name: shop_west_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # UI web
      - "1025:1025"   # SMTP
    networks:
      - shop_west

networks:
  shop_west:
    driver: bridge

volumes:
  shop_west_mysql:
    driver: local
